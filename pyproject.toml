[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aac_app"
version = "1.0.0"
description = "An experimental environment for simulating augmentative and alterantive communication app"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "PySide6==6.10.1",
    "PyYAML==6.0.3",
    "yapper-tts==0.7.1",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
]

[project.scripts]
start_app = "app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "config_files/icons/*.svg",
    "config_files/keyboards_layout/*.yml",
]
