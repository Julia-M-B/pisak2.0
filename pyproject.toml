[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aac_app"
version = "1.0.0"
description = "An experimental environment for simulating augmentative and alterantive communication app"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<3.14"
dependencies = [
    "PySide6==6.10.1",
    "PyYAML==6.0.3",
    "yapper-tts==0.7.1",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pre-commit==4.6.0",
]

[project.scripts]
start_app = "aac_app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aac_app*"]

[tool.setuptools.package-data]
# resources/**/* recurses into icons/ and keyboards_layout/, so no need to list
# each extension. models/ is listed by extension ON PURPOSE: only the small files
# (tokenizer, unigram list) are bundled - the large *.pt weights are downloaded at
# runtime (see aac_app.predictions.model_store), so they must NOT be globbed in.
aac_app = [
    "resources/**/*",
    "models/*.model",
    "models/*.csv",
]

[tool.isort]
# Keep isort compatible with black so the two formatters don't fight
# (black uses an 88-char line length; isort's default is 79).
profile = "black"
