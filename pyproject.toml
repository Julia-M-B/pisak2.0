[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pisak"
version = "2.0.0"
description = "PISAK 2.0 alternative communication application"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "PySide6==6.10.1",
    "PyYAML==6.0.3",
    "yapper-tts==0.7.1",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
]

[project.scripts]
start_app = "app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
